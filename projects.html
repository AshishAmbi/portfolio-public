<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects · Portfolio</title>
<meta name="description" content="Embedded systems, IoT, and electronics projects — searchable and filterable by category." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="page-loader" id="page-loader"><div class="loader-trace"></div></div>
<div id="navbar-root"></div>

<main>
  <section class="section container" style="padding-top: calc(var(--nav-height) + var(--space-7));">
    <div class="section-head">
      <span class="eyebrow">All Work</span>
      <h1 style="font-size: var(--fs-2xl);">Projects</h1>
      <p>Search or filter by category to find a specific build.</p>
    </div>

    <div class="projects-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="project-search" placeholder="Search projects, tech, keywords…" />
      </div>
      <div class="filter-chips" id="filter-chips"></div>
    </div>

    <div class="grid grid-3" id="projects-grid">
      <div class="skeleton" style="height:320px;"></div>
      <div class="skeleton" style="height:320px;"></div>
      <div class="skeleton" style="height:320px;"></div>
    </div>
  </section>
</main>

<div id="footer-root"></div>
<button class="scroll-top-btn" id="scroll-top-btn" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script type="module" src="js/pages/projects.js"></script>
</body>
</html>
